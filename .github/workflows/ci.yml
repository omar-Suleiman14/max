name: CI

on:
  push:
    branches:
      - main
      - release/v0.1.0
  pull_request:
    branches:
      - main
      - release/v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Electron runtime smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Build native application bundle
        run: npm run build

      - name: Verify production size budgets
        run: npm run verify:size
