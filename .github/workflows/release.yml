name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  native:
    name: Native artifact · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete automated suite
        run: npm test

      - name: Build native installer
        run: npm run make

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Max-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error

  flatpak:
    name: Flatpak artifact · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elfutils flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Build Flatpak
        run: npm run make:flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-flatpak
          path: out/make/**/*.flatpak
          if-no-files-found: error
