name: Release builds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  native:
    name: Native artifact · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate stable release version
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete automated suite
        run: npm test

      - name: Build native installer
        if: runner.os != 'macOS'
        run: npm run make

      - name: Build native macOS app archive
        if: runner.os == 'macOS'
        run: npx electron-forge make --targets=@electron-forge/maker-zip

      - name: Verify Windows update packages
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-update-feed.cjs out/make "$(node -p 'require("./package.json").version')"

      # Release assets do not count against the Actions artifact storage quota,
      # so installers go straight to the release instead of through an artifact.
      - name: Attach installers to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find out/make -type f ! -name '*-win32-x64-*.zip' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "electron-forge produced no installers." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Upload native artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Max-${{ matrix.os }}
          path: |
            out/make/**/*
            !out/make/**/*-win32-x64-*.zip
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Flatpak artifact · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elfutils flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Build Flatpak
        run: npm run make:flatpak

      - name: Attach Flatpak bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find out/make -type f -name '*.flatpak' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "The Flatpak build produced no bundle." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Upload Flatpak artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Max-flatpak
          path: out/make/**/*.flatpak
          if-no-files-found: error
          retention-days: 1
