name: Release builds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  native:
    name: Native artifact · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate stable release version
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete automated suite
        run: npm test

      - name: Build native installer
        if: runner.os != 'macOS'
        run: npm run make

      - name: Build native macOS app archive
        if: runner.os == 'macOS'
        run: npx electron-forge make --targets=@electron-forge/maker-zip

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Max-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error

  flatpak:
    name: Flatpak artifact · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes elfutils flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prepare trusted build runtimes
        run: npm run setup:runtime

      - name: Build Flatpak
        run: npm run make:flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: Max-flatpak
          path: out/make/**/*.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [native, flatpak]
    concurrency:
      group: max-stable-update-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Max-*
          path: artifacts

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Advance Cloudflare update feed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-updates.cjs artifacts
